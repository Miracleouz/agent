services:
  cota:
    build: .
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-}
      WHATSAPP_AUTO_CONNECT: "true"
      AUTO_TRANSCRIBE: ${AUTO_TRANSCRIBE:-false}
      WHATSAPP_AUTH_TIMEOUT_MS: ${WHATSAPP_AUTH_TIMEOUT_MS:-90000}
    volumes:
      - cota-data:/app/data
    shm_size: 512mb
volumes:
  cota-data:
